<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign In — DispatchLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#38b478',
              dark:    '#2ea066',
              light:   '#e3f4ec',
            },
            surface: '#111917',
            card:    '#1a2820',
            ink:     '#eef5f0',
            muted:   '#8a948e',
            border:  'rgba(255,255,255,0.1)',
            err:     '#9d2e2e',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Arial', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 40px #111917 inset !important;
      -webkit-text-fill-color: #eef5f0 !important;
    }
    .shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    /* forgot-password modal backdrop */
    #fpModal { backdrop-filter: blur(4px); }
  </style>
</head>

<body class="bg-surface min-h-screen flex items-center justify-center p-4 font-sans antialiased">

  <!-- ─── Card ─── -->
  <div id="card" class="bg-card border border-border rounded-2xl p-10 w-full max-w-sm shadow-2xl">

    <!-- Logo -->
    <div class="flex justify-center mb-5">
      <div class="w-13 h-13 rounded-xl bg-gradient-to-br from-brand to-emerald-200 flex items-center justify-center
                  text-[#10201a] font-black text-2xl shadow-lg select-none" style="width:52px;height:52px">D</div>
    </div>

    <h1 class="text-ink text-[22px] font-bold tracking-tight text-center mb-1">DispatchLink</h1>
    <p class="text-muted text-sm text-center mb-7">Operator access — sign in to continue</p>

    <!-- Error banner -->
    <div id="errorBanner"
         class="hidden bg-red-900/20 border border-red-700/40 rounded-lg text-red-400 text-[13px] px-4 py-3 mb-5">
      <span id="errorText">Invalid email or password. Please try again.</span>
    </div>

    <!-- Success banner (for forgot-password confirmation) -->
    <div id="successBanner"
         class="hidden bg-green-900/20 border border-green-700/40 rounded-lg text-green-400 text-[13px] px-4 py-3 mb-5">
      <span id="successText"></span>
    </div>

    <!-- Login form -->
    <form id="loginForm" method="POST" action="/login" novalidate>

      <!-- Email -->
      <div class="mb-4">
        <label for="email" class="block text-[11px] font-extrabold uppercase tracking-widest text-muted mb-1.5">
          Email
        </label>
        <input
          id="email" name="email" type="email"
          placeholder="you@example.com"
          autocomplete="email"
          class="w-full bg-surface border border-white/10 rounded-lg px-3.5 py-3 text-ink text-[15px]
                 outline-none transition-all duration-150
                 focus:border-brand focus:ring-2 focus:ring-brand/20
                 placeholder:text-muted/50"
          required
        >
        <p id="emailErr" class="hidden text-red-400 text-xs mt-1">Please enter a valid email address.</p>
      </div>

      <!-- Password -->
      <div class="mb-5">
        <div class="flex items-center justify-between mb-1.5">
          <label for="password" class="block text-[11px] font-extrabold uppercase tracking-widest text-muted">
            Password
          </label>
          <button type="button" id="forgotBtn"
                  class="text-brand text-xs font-semibold hover:text-brand-dark transition-colors">
            Forgot password?
          </button>
        </div>
        <div class="relative">
          <input
            id="password" name="password" type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            class="w-full bg-surface border border-white/10 rounded-lg px-3.5 py-3 text-ink text-[15px]
                   outline-none transition-all duration-150 pr-11
                   focus:border-brand focus:ring-2 focus:ring-brand/20
                   placeholder:text-muted/50"
            required
          >
          <!-- Show/hide toggle -->
          <button type="button" id="togglePwd"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-ink transition-colors"
                  aria-label="Toggle password visibility">
            <svg id="eyeShow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eyeHide" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="hidden">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <p id="pwdErr" class="hidden text-red-400 text-xs mt-1">Password is required.</p>
      </div>

      <!-- Remember me -->
      <div class="flex items-center gap-2.5 mb-6">
        <input id="remember" name="remember" type="checkbox" value="on"
               class="w-4 h-4 rounded border-white/20 bg-surface accent-brand cursor-pointer">
        <label for="remember" class="text-muted text-sm cursor-pointer select-none">
          Remember me for 30 days
        </label>
      </div>

      <!-- Submit -->
      <button id="submitBtn" type="submit"
              class="w-full bg-brand hover:bg-brand-dark active:scale-[0.98] text-[#10201a] font-bold text-[15px]
                     rounded-lg py-3 transition-all duration-150 flex items-center justify-center gap-2">
        <span id="btnText">Sign in</span>
        <svg id="btnArrow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
        <svg id="btnSpinner" class="hidden animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4" stroke-dashoffset="10" stroke-linecap="round"/>
        </svg>
      </button>
    </form>

    <p class="text-muted text-sm text-center mt-6">
      New here?
      <a href="/signup" class="text-brand font-semibold hover:text-brand-dark transition-colors">Create a company account</a>
    </p>
  </div>

  <!-- ─── Forgot Password Modal ─── -->
  <div id="fpModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-card border border-border rounded-2xl p-8 w-full max-w-sm shadow-2xl">
      <h2 class="text-ink text-lg font-bold mb-2">Reset your password</h2>
      <p class="text-muted text-sm mb-5">Enter your email and we'll send you reset instructions.</p>

      <div id="fpError" class="hidden bg-red-900/20 border border-red-700/40 rounded-lg text-red-400 text-[13px] px-4 py-3 mb-4"></div>
      <div id="fpSuccess" class="hidden bg-green-900/20 border border-green-700/40 rounded-lg text-green-400 text-[13px] px-4 py-3 mb-4"></div>

      <input id="fpEmail" type="email" placeholder="you@example.com"
             class="w-full bg-surface border border-white/10 rounded-lg px-3.5 py-3 text-ink text-[15px]
                    outline-none transition-all duration-150 mb-4
                    focus:border-brand focus:ring-2 focus:ring-brand/20
                    placeholder:text-muted/50">

      <div class="flex gap-3">
        <button id="fpCancel"
                class="flex-1 border border-white/10 text-muted text-sm font-semibold rounded-lg py-2.5 hover:border-white/20 hover:text-ink transition-all">
          Cancel
        </button>
        <button id="fpSubmit"
                class="flex-1 bg-brand hover:bg-brand-dark text-[#10201a] text-sm font-bold rounded-lg py-2.5 transition-all">
          Send instructions
        </button>
      </div>
    </div>
  </div>

  <script>
    // ── Show error if redirect carries ?error=1 ──
    const params = new URLSearchParams(location.search);
    if (params.get('error') === '1') {
      showError('Invalid email or password. Please try again.');
      document.getElementById('card').classList.add('shake');
      document.getElementById('email').focus();
    }

    function showError(msg) {
      const el = document.getElementById('errorBanner');
      document.getElementById('errorText').textContent = msg;
      el.classList.remove('hidden');
    }
    function hideError() {
      document.getElementById('errorBanner').classList.add('hidden');
    }

    // ── Real-time validation ──
    const emailInput = document.getElementById('email');
    const pwdInput   = document.getElementById('password');

    emailInput.addEventListener('blur', () => {
      const err = document.getElementById('emailErr');
      if (emailInput.value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value)) {
        err.classList.remove('hidden');
        emailInput.classList.add('border-red-700/60');
      } else {
        err.classList.add('hidden');
        emailInput.classList.remove('border-red-700/60');
      }
    });

    emailInput.addEventListener('input', () => {
      hideError();
      document.getElementById('emailErr').classList.add('hidden');
      emailInput.classList.remove('border-red-700/60');
    });

    pwdInput.addEventListener('input', () => {
      hideError();
      document.getElementById('pwdErr').classList.add('hidden');
      pwdInput.classList.remove('border-red-700/60');
    });

    // ── Show/hide password toggle ──
    document.getElementById('togglePwd').addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      document.getElementById('eyeShow').classList.toggle('hidden', isPassword);
      document.getElementById('eyeHide').classList.toggle('hidden', !isPassword);
    });

    // ── Form submit: client-side validation + loading state ──
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      let valid = true;

      if (!emailInput.value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value)) {
        document.getElementById('emailErr').classList.remove('hidden');
        emailInput.classList.add('border-red-700/60');
        valid = false;
      }
      if (!pwdInput.value) {
        document.getElementById('pwdErr').classList.remove('hidden');
        pwdInput.classList.add('border-red-700/60');
        valid = false;
      }

      if (!valid) {
        e.preventDefault();
        document.getElementById('card').classList.remove('shake');
        void document.getElementById('card').offsetWidth; // reflow
        document.getElementById('card').classList.add('shake');
        return;
      }

      // Show spinner
      document.getElementById('btnText').textContent  = 'Signing in…';
      document.getElementById('btnArrow').classList.add('hidden');
      document.getElementById('btnSpinner').classList.remove('hidden');
      document.getElementById('submitBtn').disabled = true;
    });

    // ── Forgot password modal ──
    const fpModal  = document.getElementById('fpModal');
    const fpEmail  = document.getElementById('fpEmail');
    const fpError  = document.getElementById('fpError');
    const fpSucc   = document.getElementById('fpSuccess');

    document.getElementById('forgotBtn').addEventListener('click', () => {
      fpModal.classList.remove('hidden');
      fpEmail.value = emailInput.value;
      fpEmail.focus();
      fpError.classList.add('hidden');
      fpSucc.classList.add('hidden');
    });

    document.getElementById('fpCancel').addEventListener('click', () => {
      fpModal.classList.add('hidden');
    });

    fpModal.addEventListener('click', (e) => {
      if (e.target === fpModal) fpModal.classList.add('hidden');
    });

    document.getElementById('fpSubmit').addEventListener('click', async () => {
      const addr = fpEmail.value.trim();
      fpError.classList.add('hidden');
      fpSucc.classList.add('hidden');

      if (!addr || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr)) {
        fpError.textContent = 'Please enter a valid email address.';
        fpError.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('fpSubmit');
      btn.textContent = 'Sending…';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: addr }),
        });
        const data = await res.json();
        fpSucc.textContent = data.message || 'If that email exists, instructions have been sent.';
        fpSucc.classList.remove('hidden');
        setTimeout(() => fpModal.classList.add('hidden'), 3000);
      } catch {
        fpError.textContent = 'Something went wrong. Please try again.';
        fpError.classList.remove('hidden');
      } finally {
        btn.textContent = 'Send instructions';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
