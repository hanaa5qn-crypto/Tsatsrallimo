<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tsatsral Limo — Secure Payment</title>
<style>
  :root{
    --bg:#f6f7f4;
    --panel:#ffffff;
    --ink:#18201d;
    --green:#176b4d;
    --line:#dfe4de;
    --radius:12px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  body{background:var(--bg);color:var(--ink);font-family:var(--font);display:grid;place-items:center;min-height:100vh;margin:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:40px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.05)}
  .icon{width:64px;height:64px;background:#e3f4ec;color:var(--green);border-radius:50%;display:grid;place-items:center;margin:0 auto 24px}
  h1{font-size:24px;margin:0 0 8px;letter-spacing:-0.02em}
  p{color:#5d6761;margin:0 0 32px;line-height:1.5}
  .btn{background:var(--green);color:white;border:0;padding:14px 24px;border-radius:8px;font-weight:700;font-size:16px;width:100%;cursor:pointer;transition:transform 0.1s}
  .btn:active{transform:scale(0.98)}
  .success{display:none}
</style>
</head>
<body>
<div class="card" id="mainCard">
  <div class="icon">
    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
  </div>
  <h1>Complete Payment</h1>
  <p>Reservation #<span id="resId"></span> for Tsatsral Limo LLC.</p>
  <button class="btn" onclick="pay()">Pay $148.00</button>
</div>

<div class="card success" id="successCard">
  <div class="icon">
    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1>Payment Successful</h1>
  <p>Thank you! Your chauffeur, Jack Dorj, will be notified shortly.</p>
  <button class="btn" onclick="window.close()" style="background:#111917">Close Window</button>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const id = window.location.pathname.split('/').pop() || '0';
  document.getElementById('resId').textContent = id;

  const btn = document.querySelector('.btn');
  btn.disabled = true;
  btn.textContent = 'Loading details...';

  let tripPrice = 148.00;

  async function loadTripDetails() {
    try {
      const response = await fetch(`/api/reservations/public/${id}`);
      if (!response.ok) throw new Error('Failed to load trip');
      const data = await response.json();
      
      tripPrice = parseFloat(data.price || 0);
      btn.textContent = `Pay $${tripPrice.toFixed(2)}`;
      btn.disabled = false;
      
      const tripDesc = document.createElement('div');
      tripDesc.style.marginTop = '16px';
      tripDesc.style.marginBottom = '24px';
      tripDesc.style.fontSize = '13px';
      tripDesc.style.color = '#5d6761';
      tripDesc.style.textAlign = 'left';
      tripDesc.style.background = '#fafafa';
      tripDesc.style.padding = '14px';
      tripDesc.style.borderRadius = '8px';
      tripDesc.style.border = '1px solid #dfe4de';
      tripDesc.innerHTML = `
        <div style="margin-bottom:6px"><b>Guest:</b> ${data.customer}</div>
        <div style="margin-bottom:6px"><b>Pickup:</b> ${data.pickup}</div>
        <div style="margin-bottom:6px"><b>Drop-off:</b> ${data.dropoff}</div>
        <div><b>Schedule:</b> ${data.date} at ${data.time}</div>
      `;
      const p = document.querySelector('.card p');
      p.parentNode.insertBefore(tripDesc, p.nextSibling);
    } catch (e) {
      console.error(e);
      btn.textContent = `Pay $${tripPrice.toFixed(2)}`;
      btn.disabled = false;
    }
  }

  loadTripDetails();

  function pay(){
    const btn = document.querySelector('.btn');
    btn.textContent = 'Processing...';
    btn.disabled = true;
    setTimeout(() => {
      document.getElementById('mainCard').style.display = 'none';
      document.getElementById('successCard').style.display = 'block';
    }, 1500);
  }
</script>
</body>
</html>
