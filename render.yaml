services:
  - type: web
    name: tsatsral-limo
    runtime: python
    rootDir: "middle man project"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn -c backend/gunicorn_conf.py backend.app:app
    plan: starter
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PRODUCTION
        value: true
      - key: DATABASE_URL
        value: sqlite:////var/data/dispatch.db
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LINQ_API_TOKEN
        sync: false
      - key: LINQ_FROM_NUMBER
        sync: false
      - key: LINQ_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PAYMENT_LINK
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
